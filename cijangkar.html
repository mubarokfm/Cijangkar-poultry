  if(keep){const e=$('#editor .ed');e.scrollTop=keep[0];e.scrollLeft=keep[1]}
}

function syncDraft(){
  draft.title=$('#mtitle').value.trim();draft.monday=$('#mstart').value||draft.monday;
  document.querySelectorAll('#editor .slot').forEach(sl=>{const[h,d,s]=['h','d','s'].map(k=>+sl.dataset[k]);const[a,b]=sl.children;
    draft.cells[h][d][s]={drug:a.value,dose:b.value.trim()};});
}

function openCatalog(){
  syncDraft();
  const draw=()=>{openModal(`<h3>${t('catalog')}</h3><form id="cf" class="row" style="margin-bottom:12px;flex-wrap:nowrap"><input class="inp" id="newdrug" placeholder="${t('drugName')}"><button class="btn g" type="submit">${t('addDrug')}</button></form>
   <div>${state.masterDrugCatalog.map((c,i)=>`<div class="li"><span>${esc(c)}</span><button class="ic del" data-act="deldrug" data-i="${i}" aria-label="${t('del')}"><i class="fa-solid fa-xmark"></i></button></div>`).join('')||`<p class="muted">${t('none')}</p>`}</div>
   <div class="acts"><button class="btn" data-act="closem">${t('close')}</button></div>`);
   $('#cf').onsubmit=async e=>{e.preventDefault();const v=$('#newdrug').value.trim();if(v&&!state.masterDrugCatalog.includes(v)){state.masterDrugCatalog.push(v);await save();refresh();draw()}};};
  const refresh=()=>{const e=$('#editor .ed');renderEditor([e.scrollTop,e.scrollLeft])};
  openCatalog.draw=()=>{refresh();draw()};draw();
}

/* ================= Quick Drug Dosage Calculator Events ================= */
function attachDosageCalcEvents() {
  const fPop = $('#dc_f_pop'), fBw = $('#dc_f_bw');
  const mPop = $('#dc_m_pop'), mBw = $('#dc_m_bw');
  const drug = $('#dc_drug'), dose = $('#dc_dose'), form = $('#dc_form'), conc = $('#dc_conc'), concUnit = $('#dc_conc_unit');

  if (!fPop) return;

  const updateUnits = () => {
    const isLiq = form.value === 'liquid';
    concUnit.innerHTML = isLiq
      ? `<option value="mg/mL">mg/mL</option><option value="g/100mL">g/100 mL</option><option value="g/L">g/L</option>`
      : `<option value="mg/g">mg/g</option><option value="g/100g">g/100 g</option><option value="g/kg">g/kg</option>`;
    runCalc();
  };

  const runCalc = () => {
    const fp = parseFloat(fPop.value) || 0;
    const fbg = parseFloat(fBw.value) || 0;
    const mp = parseFloat(mPop.value) || 0;
    const mbg = parseFloat(mBw.value) || 0;
    
    // Konversi massa bobot badan (g ke kg) dan dihitung per jenis kelamin (bukan dirata-rata total)
    const fWeightKg = (fp * fbg) / 1000;
    const mWeightKg = (mp * mbg) / 1000;
    const totalBirds = fp + mp;
    const totalWeightKg = fWeightKg + mWeightKg;

    $('#dc_res_fpop').textContent = n0(fp);
    $('#dc_res_fbw').textContent = nd(fWeightKg, 2);
    $('#dc_res_mpop').textContent = n0(mp);
    $('#dc_res_mbw').textContent = nd(mWeightKg, 2);
    $('#dc_res_totpop').textContent = n0(totalBirds);
    $('#dc_res_totbw').textContent = nd(totalWeightKg, 2);

    const dName = drug.value.trim() || '—';
    const dDose = parseFloat(dose.value) || 0;
    const cVal = parseFloat(conc.value) || 0;
    const cUnit = concUnit.value;
    const isLiq = form.value === 'liquid';
    
    $('#dc_res_form').textContent = isLiq ? 'Liquid (Cair)' : 'Solid (Padat/Serbuk)';
    $('#dc_res_drug').textContent = dName;
    $('#dc_res_dose').textContent = dDose > 0 ? `${dDose} mg/kg` : '0 mg/kg';

    if (totalWeightKg > 0 && dDose > 0 && cVal > 0) {
      // Perhitungan Active Ingredient Required
      const reqActiveMg = dDose * totalWeightKg;
      $('#dc_res_active').textContent = `${nd(reqActiveMg, 2)} mg`;

      // Konversi secara otomatis konsentrasi produk ke base unit (mg/mL atau mg/g)
      let baseConcMgPerUnit = 0; 
      if (cUnit === 'mg/mL' || cUnit === 'mg/g') baseConcMgPerUnit = cVal;
      else if (cUnit === 'g/100mL' || cUnit === 'g/100g') baseConcMgPerUnit = cVal * 10;
      else if (cUnit === 'g/L' || cUnit === 'g/kg') baseConcMgPerUnit = cVal * 1; 

      if (baseConcMgPerUnit > 0) {
        // Perhitungan Total Produk yang Dibutuhkan
        const reqProduct = reqActiveMg / baseConcMgPerUnit;
        $('#dc_res_final').innerHTML = `${nd(reqProduct, 2)} <span style="font-size:16px; font-weight:700">${isLiq ? 'mL' : 'g'}</span>`;
      } else {
        $('#dc_res_final').innerHTML = `0.00 <span style="font-size:16px; font-weight:700">${isLiq ? 'mL' : 'g'}</span>`;
      }
    } else {
      $('#dc_res_active').textContent = `0.00 mg`;
      $('#dc_res_final').innerHTML = `0.00 <span style="font-size:16px; font-weight:700">${isLiq ? 'mL' : 'g'}</span>`;
    }
  };

  form.addEventListener('change', updateUnits);
  
  const triggers = document.querySelectorAll('.calc-trigger');
  triggers.forEach(el => el.addEventListener('input', runCalc));
  
  // Inisiasi awal dropdown unit (tanpa override nilai input sebelumnya)
  if(concUnit.options.length === 0) updateUnits();
}


/* ================= render & events ================= */
function render(){
  document.documentElement.classList.toggle('dark',ui.dark);document.documentElement.lang=ui.lang;
  
  // Dynamic background gradient based on house selection
  const gradVar = ui.house === 'all' ? 'var(--dash-grad-0)' : `var(--dash-grad-${ui.house})`;
  document.body.style.backgroundImage = gradVar;

  $('#subt').textContent=t('sub');
  document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===ui.lang));
  $('#dark i').className='fa-solid '+(ui.dark?'fa-sun':'fa-moon');
  $('#quick').innerHTML=`<i class="fa-solid fa-plus"></i><span class="qt">${t('quick')}</span>`;$('#quick').setAttribute('aria-label',t('quick'));
  const nm=state.profile.name||'Vet',ini=nm.replace(/^drh?\.\s*/i,'').split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase()||'V';
  $('#prof').innerHTML=`<i>${esc(ini)}</i><span>${esc(nm)}<small>${t('vet')}</small></span>`;
  const badge=pendingSoon(true).length;
  $('#nav').innerHTML=NAV.map(([k,ic])=>`<button data-act="nav" data-v="${k}" data-tip="${esc(t(k))}" aria-label="${esc(t(k))}" class="${ui.tab===k?'on':''}"${ui.tab===k?' aria-current="page"':''}><i class="fa-solid ${ic}"></i>${k==='samples'&&badge?`<span class="badge">${badge}</span>`:''}</button>`).join('');
  $('#main').innerHTML=VIEWS[ui.tab]();
  
  const ms=$('#mxsel');if(ms)ms.onchange=e=>{ui.matrixId=e.target.value;render()};
  const sr=$('#search');if(sr)sr.oninput=e=>{ui.search=e.target.value;const p=e.target.selectionStart;render();const n=$('#search');n.focus();n.setSelectionRange(p,p)};
  const sm=$('#sumtxt');if(sm)sm.onblur=async()=>{state.report.summary=sm.textContent.trim();await save()};
  
  const diagF = $('#diagHouseFilter');
  if (diagF) diagF.onchange = e => { ui.diagHouse = e.target.value; render(); };

  const prodRowsSel = $('#prodRowsSel');
  if (prodRowsSel) prodRowsSel.onchange = e => { ui.prodRowsPerPage = +e.target.value; ui.prodCurrentPage = 1; render(); };

  const prevBtn = $('#prodPrevBtn');
  if (prevBtn) prevBtn.onclick = () => { if (ui.prodCurrentPage > 1) { ui.prodCurrentPage--; render(); } };
  const nextBtn = $('#prodNextBtn');
  if (nextBtn) nextBtn.onclick = () => { ui.prodCurrentPage++; render(); };

  const sampRowsSel = $('#sampRowsSel');
  if (sampRowsSel) sampRowsSel.onchange = e => { ui.sampRowsPerPage = +e.target.value; ui.sampCurrentPage = 1; render(); };

  const sPrevBtn = $('#sampPrevBtn');
  if (sPrevBtn) sPrevBtn.onclick = () => { if (ui.sampCurrentPage > 1) { ui.sampCurrentPage--; render(); } };
  const sNextBtn = $('#sampNextBtn');
  if (sNextBtn) sNextBtn.onclick = () => { ui.sampCurrentPage++; render(); };

  document.querySelectorAll('.table-status-sel').forEach(sel => {
    sel.onchange = async (e) => {
      const id = e.target.dataset.id;
      const newSt = e.target.value;
      const sObj = state.samples.find(x => x.id === id);
      if (sObj) {
        sObj.status = newSt;
        await save();
        render();
        toast('Status berhasil diperbarui');
      }
    };
  });

  const closeAlertBtn = $('#closealertbtn');
  if (closeAlertBtn) closeAlertBtn.onclick = () => { ui.dismissAlert = true; render(); };

  drawCharts();

  if(ui.tab === 'schedule') {
    attachDosageCalcEvents();
  }
}

function runCalc(){
  const list=($('#wts').value.split(/[\s,;]+/)).map(Number).filter(x=>x>0&&isFinite(x));
  if(!list.length){$('#cerr').textContent=t('badW');return null}
  $('#cerr').textContent='';const s=bwStats(list);
  $('#cres').hidden=false;$('#r1').textContent=n0(s.n);$('#r2').textContent=nd(s.mean);$('#r3').textContent=nd(s.unif)+'%';$('#r4').textContent=nd(s.cv)+'%';$('#savecalc').disabled=false;
  runCalc.last=s;return s;
}

document.addEventListener('click',async e=>{
  if(!e.target.closest('.dd'))closeDD();
  const lg=e.target.closest('[data-lang]');if(lg){ui.lang=lg.dataset.lang;await save();render();if($('#editor').innerHTML){syncDraft();renderEditor()}return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const{act,col,id,v,k,i}=el.dataset;

  if(act==='ddtoggle'){const m=el.nextElementSibling,open=m.hidden;closeDD();m.hidden=!open;el.setAttribute('aria-expanded',String(open))}
  else if(act==='ddpick'){ui.house=v;render()}
  else if(act==='nav'){ui.tab=v;ui.search='';render();window.scrollTo(0,0)}
  else if(act==='setchartdays'){ui.chartDays=+v;render()}
  else if(act==='openrefmod'){ui.tab='refmod';render();window.scrollTo(0,0)}
  else if(act==='refmodcancel'){ui.tab='prodinput';render();window.scrollTo(0,0)}
  else if(act==='refmodedit'){
    document.querySelectorAll('.ref-view').forEach(el=>el.style.display='none');
    document.querySelectorAll('.ref-edit').forEach(el=>el.style.display='inline-block');
    $('#refEditBtn').style.display='none';
    $('#refSaveBtn').style.display='inline-flex';
    toast('Mode Edit Modul Acuan Aktif. Silakan ubah nilai sesuai kebutuhan.');
  }
  else if(act==='refmodsave'){
    const inputs = document.querySelectorAll('.ref-edit');
    if(!state.productionReference) state.productionReference = getDefaultReferenceTable();
    inputs.forEach(inp => {
      const w = +inp.dataset.w;
      const key = inp.dataset.k;
      const val = inp.value;
      if (!state.productionReference[w]) state.productionReference[w] = {};
      if (key === 'sexRatio') {
        state.productionReference[w][key] = val;
      } else {
        state.productionReference[w][key] = parseFloat(val) || 0;
      }
    });
    await save();
    ui.tab = 'prodinput';
    render();
    toast('Production Reference Module berhasil diperbarui & disimpan.');
  }
  else if(act==='add')openForm(col);
  else if(act==='adddailyprod')openDailyProductionModal();
  else if(act==='editpop')openPopEditModal();
  else if(act==='edit'){
    if (col === 'dailyEntryLogs') openDailyProductionModal(state.dailyEntryLogs.find(r => r.id === id));
    else openForm(col,state[col].find(r=>r.id===id));
  }
  else if(act==='del'){
    const itemToDelete = state[col].find(r=>r.id===id);
    if (itemToDelete) {
      lastDeleted = { col, item: JSON.parse(JSON.stringify(itemToDelete)) };
      state[col] = state[col].filter(r=>r.id!==id);
      await save();
      render();
      toast('Data berhasil dihapus.', true);
    }
  }
  else if(act==='result')openResult(state.samples.find(r=>r.id===id));
  else if(act==='closem')closeModal();
  else if(act==='quickgo'){closeModal();ui.tab={dailyEntryLogs:'prodinput',mortalityLogs:'mortality',necropsyRecords:'necropsy',bodyWeightData:'bw',samples:'samples'}[k];render();if(k==='dailyEntryLogs')openDailyProductionModal();else openForm(k)}
  else if(act==='pop')openPopEditModal();
  else if(act==='print'){try{window.print()}catch(_){toast('Print is not available here')}}
  else if(act==='newmx')openEditor(null);
  else if(act==='editmx')openEditor(curMatrix());
  else if(act==='delmx-confirm'){
    if(confirm("Yakin ingin menghapus jadwal ini secara permanen?")) {
      state.weeklyMatrixList=state.weeklyMatrixList.filter(x=>x.id!==draft.id);
      ui.matrixId=null;
      $('#editor').innerHTML=''; draft=null;
      await save(); render(); toast('Jadwal berhasil dihapus.', true);
    }
  }
  else if(act==='catalog')openCatalog();
  else if(act==='deldrug'){state.masterDrugCatalog.splice(+i,1);await save();openCatalog.draw()}
  else if(act==='closeed'){$('#editor').innerHTML='';draft=null}
  else if(act==='applyCb'){
    const menu = el.closest('.dd-menu');
    const allCb = menu.querySelector('input[value="all"]');
    if (allCb && allCb.checked) {
      ui[k] = [1,2,3,4,5,6,7,8,9];
    } else {
      const cbs = menu.querySelectorAll('.h-cb');
      const selected = [];
      cbs.forEach(cb => { if(cb.checked) selected.push(+cb.value); });
      ui[k] = selected.length ? selected : [1]; // Fallback to house 1 if none checked
    }
    if (k === 'prodHouseFilter') ui.prodCurrentPage = 1;
    if (k === 'sampHouseFilter') ui.sampCurrentPage = 1;
    render();
  }
  else if(act==='saveed'){
    syncDraft();if(!draft.title){$('#eerr').textContent=`${t('mxTitle')} ${t('req')}`;return}
    draft.monday=mondayOf(draft.monday);delete draft.isNew;
    const ix=state.weeklyMatrixList.findIndex(m=>m.id===draft.id);if(ix>=0)state.weeklyMatrixList[ix]=draft;else state.weeklyMatrixList.push(draft);
    ui.matrixId=draft.id;draft=null;$('#editor').innerHTML='';await save();render();toast(t('saved'));
  }
  else if(act==='calc')runCalc();
  else if(act==='calc2log'){const s=runCalc.last||runCalc();if(!s)return;openForm('bodyWeightData',null,{mean:Math.round(s.mean),unif:+s.unif.toFixed(1),cv:+s.cv.toFixed(1),n:s.n})}
  else if(act==='regen'){state.report.summary='';await save();render()}
  else if(act==='backup')download(`aviancare-backup-${today()}.json`,JSON.stringify(state,null,2),'application/json');
  else if(act==='seed'){state=seed();state.settings={lang:ui.lang,dark:ui.dark};await save();closeModal();render();toast(t('saved'))}
  else if(act==='wipe'){
    const p=state.profile;state=seed();['samples','necropsyRecords','bodyWeightData','mortalityLogs','productionLogs','weeklyMatrixList','dailyEntryLogs'].forEach(x=>state[x]=[]);state.profile=p;await save();closeModal();render();toast(t('deleted'));
  }
  else if(act==='viewnec')openNecropsyView(id);
});

$('#dark').onclick=async()=>{ui.dark=!ui.dark;await save();render()};
$('#quick').onclick=openQuick;
$('#prof').onclick=openProfile;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDD();if($('#modal').innerHTML)closeModal()}});

    subEl.innerHTML = `<i class="fa-regular fa-clock" style="margin-right:4px"></i>${dtInfo.timeStr}`;

load().then(render);
